[tools]
golangci-lint = "2.13.2"
go = "1.27.1"
gofumpt = "0.11.0"
lefthook = "2.1.12"
cocogitto = "7.0.0"

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.sync-branch]
description = "Sync package manager deps"
run = """
mise prune -y
go mod tidy
lefthook install
"""
