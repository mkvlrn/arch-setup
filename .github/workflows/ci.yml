name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: check shell scripts
        run: ./.github/workflows/scripts/check-shell.sh

  arch-test:
    needs: shell-check
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: prepare arch VM
        run: ./.github/workflows/scripts/prepare-vm.sh

      - name: test installer in Arch VM
        run: ./.github/workflows/scripts/test-vm.sh

      - name: stop arch VM
        if: always()
        run: ./.github/workflows/scripts/stop-vm.sh

  ubuntu-test:
    needs: shell-check
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: prepare Ubuntu VM
        run: ./.github/workflows/scripts/prepare-ubuntu-vm.sh

      - name: test installer in Ubuntu VM
        run: ./.github/workflows/scripts/test-ubuntu-vm.sh

      - name: stop Ubuntu VM
        if: always()
        run: ./.github/workflows/scripts/stop-ubuntu-vm.sh
