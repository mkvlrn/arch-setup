name: checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Setup Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Alias Bun canary
        run: sudo ln -s "$(command -v bun)" /usr/local/bin/bunc

      - run: bun install
      - run: mise typecheck
      - run: mise lint
      - run: mise test-ci
