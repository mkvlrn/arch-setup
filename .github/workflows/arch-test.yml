name: arch-test

on:
  workflow_dispatch:

jobs:
  arch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Download Arch VM
        run: |
          curl -fsSL \
            https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-basic.qcow2 \
            -o arch.qcow2

          qemu-img create -f qcow2 -F qcow2 \
            -b "$PWD/arch.qcow2" \
            arch-test.qcow2

      - name: Boot Arch VM
        run: |
          sudo chmod 666 /dev/kvm

          qemu-system-x86_64 \
            -enable-kvm \
            -cpu host \
            -m 2G \
            -smp 2 \
            -drive file=arch-test.qcow2,format=qcow2 \
            -nic user,hostfwd=tcp::2222-:22 \
            -nographic \
            >qemu.log 2>&1 &

          echo $! > qemu.pid

          for i in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/2222' 2>/dev/null; then
              echo "Arch VM SSH is up"
              exit 0
            fi

            sleep 2
          done

          cat qemu.log
          exit 1

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if sshpass -p arch ssh \
              -p 2222 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=2 \
              arch@127.0.0.1 \
              'true'
            then
              exit 0
            fi

            sleep 2
          done

          exit 1

      - name: Run arch-setup
        run: |
          sshpass -p arch ssh \
            -p 2222 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            arch@127.0.0.1 \
            'curl -fsSL https://mkvlrn.github.io/arch-setup/ | sh'

      - name: Check system files
        run: |
          sshpass -p arch ssh \
            -p 2222 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            arch@127.0.0.1 \
            'sudo ls -l /etc/docker/daemon.json /etc/brave/policies/managed/policies.json &&
            sudo cat /etc/docker/daemon.json &&
            sudo cat /etc/brave/policies/managed/policies.json'
