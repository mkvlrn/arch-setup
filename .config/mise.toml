[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"
lefthook = "2.1.12"
cocogitto = "7.0.0"

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.default]
depends = ["lint"]

[tasks.lint]
run = [
  "shellcheck config.sh install.sh verify.sh .github/workflows/scripts/*.sh secrets/*.sh",
  "bash -n config.sh install.sh verify.sh .github/workflows/scripts/*.sh secrets/*.sh",
]

[tasks.format]
run = "shfmt -w config.sh install.sh verify.sh .github/workflows/scripts/*.sh secrets/*.sh"

[tasks.format-check]
run = "shfmt -d config.sh install.sh verify.sh .github/workflows/scripts/*.sh secrets/*.sh"

[tasks.sync-branch]
run = """
if command -v mise >/dev/null 2>&1; then mise prune -y; fi
lefthook install
"""
