name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: check whether push merged a PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/scripts/check-release.sh

  check-build:
    needs: release-check
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: check and build
        run: ./.github/workflows/scripts/check-build.sh

      - name: upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arch-setup
          path: ./bin/arch-setup
          if-no-files-found: error

  arch-test:
    if: |
      github.event_name == 'pull_request' ||
      needs.release-check.outputs.release != 'true'
    needs:
      - check-build
      - release-check
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arch-setup
          path: ./bin

      - name: restore package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arch-package-cache
          key: arch-packages-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arch-packages-x86_64-

      - name: prepare arch VM
        run: ./.github/workflows/scripts/prepare-vm.sh

      - name: test executable
        env:
          PACKAGE_CACHE_DIR: ${{ runner.temp }}/arch-package-cache
        run: ./.github/workflows/scripts/test-vm.sh

      - name: stop arch VM
        if: always()
        run: ./.github/workflows/scripts/stop-vm.sh

  release:
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.check-build.result == 'success' &&
      (
        needs.release-check.outputs.release == 'true' ||
        needs.arch-test.result == 'success'
      )
    needs:
      - check-build
      - release-check
      - arch-test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arch-setup
          path: ./bin

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/scripts/release.sh
