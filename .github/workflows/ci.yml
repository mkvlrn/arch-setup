name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-build:
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4

      - name: check and build
        run: ./.github/workflows/scripts/check-build.sh

      # preserve the exact executable produced by this job so both the VM
      # test and release job consume identical bytes.
      - name: upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arch-setup
          path: ./bin/arch-setup
          if-no-files-found: error

  arch-test:
    # PRs still get the normal checks/build above. The relatively expensive
    # full-machine integration test runs only after changes land on main.
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    if: github.event_name == 'push'
    needs: check-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: download executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arch-setup
          path: ./bin

      - name: restore package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arch-package-cache
          key: arch-packages-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arch-packages-x86_64-

      - name: prepare arch VM
        run: ./.github/workflows/scripts/prepare-vm.sh

      - name: test executable
        env:
          PACKAGE_CACHE_DIR: ${{ runner.temp }}/arch-package-cache
        run: ./.github/workflows/scripts/test-vm.sh

      - name: stop arch VM
        if: always()
        run: ./.github/workflows/scripts/stop-vm.sh

  release:
    # A release cannot exist unless both the build/checks and the real Arch
    # VM integration test succeeded.
    if: github.event_name == 'push'
    needs:
      - check-build
      - arch-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: download tested executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: arch-setup
          path: ./bin

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/scripts/release.sh
