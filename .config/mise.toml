[tools]
shellcheck = "0.11.0"
shfmt = "3.14.1"
lefthook = "2.1.12"
cocogitto = "7.0.0"

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.default]
depends = ["lint"]

[tasks.lint]
run = [
  "shellcheck index.html arch/*.sh secrets/*.sh .github/workflows/scripts/*.sh",
  "bash -n index.html arch/*.sh secrets/*.sh .github/workflows/scripts/*.sh",
]

[tasks.format]
run = "shfmt -w index.html arch/*.sh secrets/*.sh .github/workflows/scripts/*.sh"

[tasks.format-check]
run = "shfmt -d index.html arch/*.sh secrets/*.sh .github/workflows/scripts/*.sh"

[tasks.sync-branch]
run = """
if command -v mise >/dev/null 2>&1; then mise prune -y; fi
lefthook install
"""
