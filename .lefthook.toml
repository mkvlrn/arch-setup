[commit-msg.commands]
cog-lint = { run = "cog verify --file {1}" }

[pre-commit.commands]
lint = { run = "make lint" }

[pre-push.commands]
lint = { run = "make lint" }
test = { run = "make test" }

[post-checkout.commands]
sync-mise = { run = "mise install" }
clean-mise = { run = "mise prune -y" }

[post-merge.commands]
sync-mise = { run = "mise install" }
clean-mise = { run = "mise prune -y" }
