[tools]
biome = "2.5.9"
bun = "1.4.0"
cocogitto = "7.0.0"
lefthook = "2.1.10"

[hooks]
postinstall = "lefthook install"

[env]
_.path = ["./node_modules/.bin"]

[settings]
disable_backends = ["asdf"]
use_versions_host = false
minimum_release_age = "1d"

[tasks.dev]
description = "Dev mode"
run = "bun main.ts"
[tasks.lint]
description = "Check files with biome"
run = "biome check --diagnostic-level=warn --no-errors-on-unmatched"
[tasks.lint-fix]
description = "Fix files with biome"
run = "biome check --diagnostic-level=warn --no-errors-on-unmatched --write"
[tasks.typecheck]
description = "Run tsc"
run = "tsc"
[tasks.test]
description = "Run tests"
run = "bun test --coverage --pass-with-no-tests"
[tasks.test-staged]
description = "Run tests on staged files"
run = "bun test --changed --bail --reporter=dots --pass-with-no-tests"
[tasks.test-ci]
description = "Run tests in ci mode"
run = "bun test --bail --reporter=dots --pass-with-no-tests"
[tasks.build]
description = "Build single file executable"
run = "rm -rf ./bin && bun build --compile --minify --bytecode ./main.ts --outfile ./bin/arch-setup"
[tasks.sync-branch]
description = "Sync package manager deps"
run = "mise install && mise prune -y && bun install --frozen-lockfile && lefthook install"
