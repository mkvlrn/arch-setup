name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    env:
      MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: lint and test
        run: ./.github/workflows/scripts/check.sh

  arch-test:
    needs: check
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: restore package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arch-package-cache
          key: arch-packages-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arch-packages-x86_64-

      - name: prepare arch VM
        run: ./.github/workflows/scripts/prepare-vm.sh

      - name: test installer
        env:
          PACKAGE_CACHE_DIR: ${{ runner.temp }}/arch-package-cache
        run: ./.github/workflows/scripts/test-vm.sh

      - name: stop arch VM
        if: always()
        run: ./.github/workflows/scripts/stop-vm.sh
